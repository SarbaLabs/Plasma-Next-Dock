<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <!-- The launcher signal only needs a private bus. Do not load desktop
       service directories or start portal processes during the offscreen test. -->
  <policy context="default">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
