name: Build and prototype checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: debian:trixie
            manifest: debian-13
            check: build
          - image: ubuntu:26.04
            manifest: ubuntu-26.04
            check: Kubuntu 26.04 build
    name: ${{ matrix.check }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 15
    steps:
      - name: Prepare checkout
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          cat packaging/apt-common.txt packaging/${{ matrix.manifest }}-packages.txt | xargs apt-get install -y --no-install-recommends locales
          localedef -i fr_FR -f UTF-8 fr_FR.UTF-8
      - name: Build
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Check isolated installation
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          test -x stage/usr/bin/plasma-next-dock
          test -f stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          grep -Fx 'Exec="/usr/bin/plasma-next-dock"' stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          grep -F "zkde_screencast_unstable_v1" stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          test -s stage/usr/share/locale/fr/LC_MESSAGES/plasma-next-dock.mo
          test ! -d stage/usr/share/plasma/plasmoids
          bash -n install.sh uninstall.sh Messages.sh
