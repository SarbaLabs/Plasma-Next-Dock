name: Build and prototype checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: debian:trixie
            manager: apt
            manifest: debian-13
            check: build
          - image: ubuntu:26.04
            manager: apt
            manifest: ubuntu-26.04
            check: Kubuntu 26.04 build
          - image: ubuntu:26.10
            manager: apt
            manifest: ubuntu-26.04
            check: Kubuntu 26.10 build
          - image: registry.fedoraproject.org/fedora:45
            manager: dnf
            manifest: fedora-45
            check: Fedora 45 build
          - image: registry.opensuse.org/opensuse/leap:16.1
            manager: zypper
            manifest: opensuse-leap-16.1
            check: openSUSE Leap 16.1 build
    name: ${{ matrix.check }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 15
    steps:
      - name: Prepare APT checkout
        if: matrix.manager == 'apt'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - name: Prepare Fedora checkout
        if: matrix.manager == 'dnf'
        run: dnf install -y git findutils tar gzip
      - name: Prepare openSUSE checkout
        if: matrix.manager == 'zypper'
        run: zypper --non-interactive install --no-recommends git-core findutils tar gzip
      - uses: actions/checkout@v4
      - name: Check missing dependency report in the clean image
        run: |
          if ./install.sh > dependency-report.log 2>&1; then exit 1; fi
          grep -F 'Missing dependencies for' dependency-report.log
          grep -Fx 'Then run ./install.sh again.' dependency-report.log
          test ! -e build
      - name: Install APT dependencies
        if: matrix.manager == 'apt'
        run: |
          cat packaging/apt-common.txt packaging/${{ matrix.manifest }}-packages.txt | xargs apt-get install -y --no-install-recommends locales
          localedef -i fr_FR -f UTF-8 fr_FR.UTF-8
      - name: Install Fedora dependencies
        if: matrix.manager == 'dnf'
        run: xargs dnf install -y glibc-langpack-fr < packaging/fedora-45-packages.txt
      - name: Install openSUSE dependencies
        if: matrix.manager == 'zypper'
        run: xargs zypper --non-interactive install --no-recommends glibc-locale < packaging/opensuse-leap-16.1-packages.txt
      - name: Build
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Check isolated installation
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          test -x stage/usr/bin/plasma-next-dock
          test -f stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          grep -Fx 'Exec="/usr/bin/plasma-next-dock"' stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          grep -F "zkde_screencast_unstable_v1" stage/usr/share/applications/org.sarbalabs.PlasmaNextDock.desktop
          test -s stage/usr/share/locale/fr/LC_MESSAGES/plasma-next-dock.mo
          test ! -d stage/usr/share/plasma/plasmoids
          bash -n install.sh uninstall.sh Messages.sh
